                    case "ArrowDown":
                        y+=movement;
                        break;
                    case "ArrowLeft":
                        x-=movement;
                        break;
                    case "ArrowRight":
                        x+=movement;
                        break;
                }
                box.style.top = `${y}px`;
                box.style.left = `${x}px`;
            }
