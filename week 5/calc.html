<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 12%;
            
        }
        /* .outer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        } */
        .buttons {
            display: grid;
            grid-template-columns: 70px 70px 70px 70px;
            grid-template-rows: 70px 70px 70px 70px;
            gap: 3px;
            /* margin-top: 50%; */
            /* position: relative; */
        }
        .buttons div {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            background-color: coral;
            padding: 10px;
            height: 50px;
            width: 50px;
            border: 1px solid ;
        }
        .buttons div:hover {
            transform: scale(103%);
        }
        #add {
            grid-column: 4 / 5;
            grid-row: 2 / 4;
            height: auto;
           
        }
        
        #zero {
            grid-column: 1 / 3;
            grid-row: 5 / 6;
            width: auto;

           
        }
        #equalto {
            grid-column-start: 4;
            grid-column-end: 5;
            /* grid-row: 2 / 4; */
            grid-row-start: 4;
            grid-row-end: 6;
            height: auto;
        }
        .display {
            width: 283.5px;
            height: 50px;
            background-color: rgb(240, 229, 229);
        }

    </style>
</head>
<body>
    <div class="outer">
        <form>
            <input type="text" dir="rtl" class="display"></label>
        </form>
        <div class="buttons">
            <div class="/"  id="divide">/</div>
            <div class="%"  id="modulus">%</div>
            <div class="*"  id="mul">*</div>
            <div class="-"  id="minus">-</div>
            <div class="7"  id="seven">7</div>
            <div class="8"  id="eight">8</div>
            <div class="9"  id="nine">9</div>
            <div class="+"  id="add" id="plus">+</div>
            <div class="4"  id="foour">4</div>
            <div class="5"  id="five">5</div>
            <div class="6"  id="six">6</div>
            <div class="1"  id="one">1</div>
            <div class="2"  id="two">2</div>
            <div class="3"  id="three">3</div>
            <div class="="  id="equalto">=</div>
            <div class="0"  id="zero" id="zero">0</div>
            <div class="."  id="dot">.</div>
        </div>
    </div>

    <script>
        const buttons = document.querySelectorAll(".buttons");
        buttons.forEach((element) => {
            element.addEventListener("click", () => {
                const num1 = element.getAttribute("class");
                console.log(num1)
            })
        });
    </script>
</body>
</html>
