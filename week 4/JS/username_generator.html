<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let name = prompt("Enter your full name");
        name = name.replaceAll(" ", "");
        name = name.toLowerCase();
        let len = name.length;
        let userid = "@" + name + len;
        confirm("Your userid is " + userid);
    </script>
</body>
</html>
