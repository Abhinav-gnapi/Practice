<body>
    <!-- <h3>Guess the number</h3> -->
    <script>
        let number = 4;
        let inp = prompt("Enter a number from range 0 - 10");

            alert("Wrong");
           inp = prompt("Try again!");
        }
        alert("Correct");
        
    </script>
