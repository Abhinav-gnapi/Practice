    <script>
        function myFunction(str) {
            let count = 0;
            let str1 = str.toLowerCase();
            for(let i of str1){
                if(i=='a'||i=='e'||i=='i'||i=='o'||i=='u'){
                    count++;
                }
            }
            return count;
        }
        console.log(myFunction("abhinav"));

        const fn = (str) => {
