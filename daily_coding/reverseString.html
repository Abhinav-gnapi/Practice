<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 10rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
        <input type="text" class="inputfield">
        <button onclick="getInputData()">Reverse</button>
        </div>
        <p id="reverse"></p>
    </div>
    <script>
        function getInputData(){
            let inputData = document.querySelector("input");
            let str = inputData.value;
            console.log(str)
            let rev = "";
            for(let i=str.length-1; i>=0; i--) {
                rev = rev + str.charAt(i);
            }
            const reverse = document.querySelector("p");
            reverse.textContent = rev;
        }
    </script>
</body>
</html>
